site_name: Egg Rivals
site_description: Canonical design and engineering record for Egg Rivals.
repo_name: novelbytelabs/roblox-egg-rivals
repo_url: https://github.com/novelbytelabs/roblox-egg-rivals
edit_uri: edit/main/docs/
dev_addr: 127.0.0.1:49187

copyright: "Copyright &copy; 2026 Novel Byte Labs - All rights reserved."

theme:
  name: material
  logo: assets/favicon.ico
  favicon: assets/favicon.ico
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - navigation.instant
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to Light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to Dark mode
  icon:
    repo: fontawesome/brands/github
extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelbytelabs/roblox-egg-rivals
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/novelbytelabs
  generator: false

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/theme.js

nav:
  - Home: index.md
  - Design:
      - Game Design Overview: GAME_DESIGN.md
      - Design Bible: DESIGN_BIBLE.md
      - Decision Ledger: DECISION_LEDGER.md
      - Resolved 0.4.0 Decisions: RESOLVED_DESIGN_DECISIONS_0.4.0.md
      - Economy, Speed & Rarity v2: ECONOMY_SPEED_RARITY_V2.md
      - Feature Status Matrix: FEATURE_STATUS_MATRIX.md
      - Core Gameplay: CORE_GAMEPLAY.md
      - Base, Incubators & Respawn: BASE_INCUBATION_RESPAWN.md
      - Pet Pen & Ranch: PET_PEN_SYSTEM.md
      - Speed Lab & Treadmill: SPEED_LAB_SYSTEM.md
      - Night System: NIGHT_SYSTEM.md
      - Night Visual Direction (compatibility): NIGHT_VISUAL_DIRECTION.md
      - Shops & Social Economy: HUB_SHOPS_AND_SOCIAL_ECONOMY.md
      - PvP & Duels: PVP_AND_DUELS.md
      - Live Operations: LIVE_OPERATIONS.md
      - Production Guardrails: PRODUCTION_GUARDRAILS.md
      - World & Balance References: WORLD_AND_BALANCE_REFERENCES.md
  - Development:
      - 0.4.5 Visitor Ranch Interactions: NEXT_SLICE_0.4.5_VISITOR_RANCH.md
      - 0.4.4 Social Drafting: NEXT_SLICE_0.4.4_SOCIAL_DRAFTING.md
      - 0.4.4 Verification: STAGE3_044_VERIFICATION.md
      - 0.4.3 Elemental Tuning: NEXT_SLICE_0.4.3_ELEMENTAL_TUNING.md
      - 0.4.3 Verification: STAGE3_043_VERIFICATION.md
      - 0.4.2 Ranger Contracts: NEXT_SLICE_0.4.2_RANGER_CONTRACTS.md
      - 0.4.2 Verification: STAGE3_042_VERIFICATION.md
      - 0.4.1 Sprint Rivalry: NEXT_SLICE_0.4.1_SPRINT_RIVALRY.md
      - 0.4.1 Verification: STAGE3_041_VERIFICATION.md
      - 0.4.0 Night/Forest Verification: STAGE3_040_RC2_VERIFICATION.md
      - 0.4.0 Living World Plan: NEXT_SLICE_0.4.0_LIVING_WORLD.md
      - Astra 0.4.0 Execution Packet: ASTRA_0.4.0_EXECUTION_PACKET.md
      - Roadmap: ROADMAP.md
      - Stage 3 Elemental Refinement: STAGE3_ELEMENTAL_REFINEMENT_0.3.2.md
      - Stage 3 Verification: STAGE3_032_VERIFICATION.md

site_name: Egg Rivals
site_description: Design direction and verification record for Egg Rivals.
repo_name: novelbytelabs/roblox-egg-rivals
repo_url: https://github.com/novelbytelabs/roblox-egg-rivals
dev_addr: 127.0.0.1:49187

repo_url: https://github.com/novelbytelabs/state-foundation/
repo_name: novelbytelabs/state-foundation
edit_uri: edit/main/docs/

copyright: "Copyright &copy; 2025 Novel Byte Labs - All rights reserved."

theme:
  name: material
  logo: assets/favicon.ico
  favicon: assets/favicon.ico
  features:
    #   - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - navigation.instant
  palette:
    # Dark mode is the default
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to Light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to Dark mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelbytelabs/ArqonConstitutiveEngine
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/novelbytelabs
  generator: false

# extra_css already defined above

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/theme.js

nav:
  - Home: index.md
  - Game Design: GAME_DESIGN.md
  - Visual Direction:
      - Night: NIGHT_VISUAL_DIRECTION.md
  - Development:
      - Roadmap: ROADMAP.md
      - Stage 3 Elemental Refinement: STAGE3_ELEMENTAL_REFINEMENT_0.3.2.md
      - Stage 3 Verification: STAGE3_032_VERIFICATION.md